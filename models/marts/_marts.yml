version: 2
models:
  - name: fct_zone_daily_snapshot
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [zone_id, snapshot_date]
    columns:
      - name: zone_id
        tests: [not_null]
      - name: snapshot_date
        tests: [not_null]
      - name: trips_1d
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
